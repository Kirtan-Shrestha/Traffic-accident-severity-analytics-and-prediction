<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Traffic accident star schema</title>
<desc>Star schema with fact_accident at the center, connected to five dimension tables: dim_date, dim_road, dim_weather, dim_location, and dim_severity.</desc>
<rect width="800" height="620" fill="#ffffff"/>

<text x="400" y="24" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2C2C2A">Traffic Accident Severity Analytics - Star Schema</text>

<!-- radiating lines -->
<line x1="400" y1="90" x2="400" y2="320" stroke="#B7B6AE" stroke-width="1"/>
<line x1="640" y1="190" x2="400" y2="320" stroke="#B7B6AE" stroke-width="1"/>
<line x1="640" y1="460" x2="400" y2="320" stroke="#B7B6AE" stroke-width="1"/>
<line x1="160" y1="460" x2="400" y2="320" stroke="#B7B6AE" stroke-width="1"/>
<line x1="160" y1="190" x2="400" y2="320" stroke="#B7B6AE" stroke-width="1"/>

<!-- dim_date -->
<rect x="290" y="40" width="220" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">dim_date</text>
<text x="400" y="94" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">date_key . full_date</text>
<text x="400" y="112" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">year . month . day . hour</text>
<text x="400" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">weekday_name . is_weekend</text>

<!-- dim_road -->
<rect x="530" y="140" width="220" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="640" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">dim_road</text>
<text x="640" y="194" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">road_key . road_type_code</text>
<text x="640" y="212" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">road_type_label</text>
<text x="640" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">speed_limit . first_road_class</text>

<!-- dim_weather -->
<rect x="530" y="410" width="220" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="640" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">dim_weather</text>
<text x="640" y="464" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">weather_key . conditions_label</text>
<text x="640" y="482" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">temperature_band</text>
<text x="640" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">precipitation_level</text>

<!-- dim_location -->
<rect x="50" y="410" width="220" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">dim_location</text>
<text x="160" y="464" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">location_key . lat / lon</text>
<text x="160" y="482" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">local_authority_district</text>
<text x="160" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">geom (PostGIS point)</text>

<!-- dim_severity -->
<rect x="50" y="140" width="220" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">dim_severity</text>
<text x="160" y="194" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">severity_key</text>
<text x="160" y="212" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">severity_code</text>
<text x="160" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">severity_label</text>

<!-- fact_accident (center, highlighted) -->
<rect x="260" y="245" width="280" height="150" rx="10" fill="#E3F5E9" stroke="#1E7A46" stroke-width="1"/>
<text x="400" y="274" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#155A34">fact_accident</text>
<text x="400" y="298" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1E7A46">collision_index . date_key</text>
<text x="400" y="316" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1E7A46">road_key . weather_key</text>
<text x="400" y="334" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1E7A46">location_key . severity_key</text>
<text x="400" y="352" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1E7A46">vehicles . casualties</text>
<text x="400" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1E7A46">temperature . precipitation . wind</text>

<text x="400" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5F5E5A">Grain: fact_accident = one row per collision record (104,246 rows)</text>
</svg>
