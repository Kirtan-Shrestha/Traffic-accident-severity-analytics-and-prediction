<svg width="680" height="712" viewBox="0 0 680 712" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Traffic accident pipeline architecture</title>
<desc>Data flows from STATS19 and Open-Meteo through ingestion, staging and validation (with a rejected-records branch), weather enrichment, PostgreSQL/PostGIS star schema, an analytical mart, to a Streamlit dashboard. Airflow orchestrates ingestion through mart-building.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="712" fill="#ffffff"/>

<!-- Airflow orchestration bracket -->
<line x1="170" y1="136" x2="170" y2="576" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="160" y1="136" x2="180" y2="136" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="160" y1="576" x2="180" y2="576" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="45" y="352" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Airflow DAG</text>
<text x="45" y="368" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">orchestrates this</text>
<text x="45" y="384" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">section</text>

<!-- B1 Data sources -->
<rect x="190" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="320" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">Data sources</text>
<text x="320" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444441">STATS19 + Open-Meteo API</text>
<line x1="320" y1="96" x2="320" y2="132" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- B2 Ingestion + raw -->
<rect x="190" y="136" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Ingestion + raw layer</text>
<text x="320" y="176" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#185FA5">Python scripts, immutable CSVs</text>
<line x1="320" y1="192" x2="320" y2="228" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- B3 Staging + validation -->
<rect x="190" y="232" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Staging + validation</text>
<text x="320" y="272" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#185FA5">Standardize, decode, check quality</text>
<line x1="450" y1="260" x2="466" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="288" x2="320" y2="324" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Rejected records -->
<rect x="470" y="232" width="160" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="550" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#791F1F">Rejected records</text>
<text x="550" y="272" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A32D2D">Error log, never dropped</text>

<!-- B4 Cleaned + weather enriched -->
<rect x="190" y="328" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Cleaned + weather-enriched</text>
<text x="320" y="368" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#185FA5">Joined by location + hour</text>
<line x1="320" y1="384" x2="320" y2="420" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- B5 PostgreSQL/PostGIS -->
<rect x="190" y="424" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="320" y="446" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">PostgreSQL / PostGIS</text>
<text x="320" y="464" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0F6E56">Star schema: 5 dims + fact</text>
<line x1="320" y1="480" x2="320" y2="516" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- B6 Analytical mart -->
<rect x="190" y="520" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="320" y="542" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Analytical mart</text>
<text x="320" y="560" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0F6E56">6 materialized views</text>
<line x1="320" y1="576" x2="320" y2="612" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- B7 Streamlit -->
<rect x="190" y="616" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="320" y="638" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#3C3489">Streamlit dashboard</text>
<text x="320" y="656" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#534AB7">7 views, 5 filters</text>
</svg>
